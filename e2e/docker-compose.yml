# End-to-end stack: a real Kafka broker + the api-mock-server image built from this repo.
#
#   docker compose -f e2e/docker-compose.yml up -d --build --wait
#   bun run test:e2e
#   docker compose -f e2e/docker-compose.yml down -v
#
# The broker has two listeners:
#   - kafka:9092      (INTERNAL)  used by the mock inside the compose network
#   - localhost:19092 (EXTERNAL)  used by the e2e suite on the host, playing "the application"
name: api-mock-e2e

services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  api-mock:
    build:
      context: ..
      dockerfile: Dockerfile
    image: api-mock-server:e2e
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
    ports:
      - "11435:11435"
      - "11437:11437"
      - "11438:11438"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:11435/health > /dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 20
